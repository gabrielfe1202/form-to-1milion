  #    resources:
  #      limits:
  #        cpus: '1.00'       # allow up to one full CPU core for load test
  #        memory: 1G         # limit memory to 1 gigabyte

  nginx:
    image: nginx:1.27-alpine
    container_name: form-to-1milion-nginx
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - form-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

networks:
  form-net:
    driver: bridge

volumes:
  localstack-data:
