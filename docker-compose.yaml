  localstack:
    image: localstack/localstack:3.8
    container_name: form-to-1milion-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=sqs
      - DEBUG=1
      - LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1
      - SQS_ENDPOINT_STRATEGY=path
      - HOSTNAME_EXTERNAL=localstack

    volumes:
      - "localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - form-net
    deploy:
      resources:
        limits:
          cpus: '10.00'
          memory: 4.5G

  #k6:
  #  image: grafana/k6
  #  container_name: k6-load-test
  #  volumes:
  #    - ./scenarios:/scripts
  #    - ./scenarios/reports:/reports
  #  working_dir: /scripts
  #  entrypoint: ["k6", "run", "load-teste.js"]
  #  depends_on:
