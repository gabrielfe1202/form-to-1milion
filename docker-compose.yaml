name: form-to-1milion

services:
  pg:
    image: postgres:15
    container_name: form-to-1milion-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: form_to_1milion_db
    ports:
      - "5432:5432"
    networks:
      - form-net
    deploy:
      resources:
        limits:
          cpus: '0.60'      
          memory: 512M

  api:
    build:
      context: .
      dockerfile: ./cmd/api/Dockerfile
    container_name: form-to-1milion-api
    depends_on:
      - pg
    ports:
      - "8080"
    environment:
      - DB_HOST=pg
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=form_to_1milion_db
      - DB_SSLMODE=disable
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/form-to-1milion-queue
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-2
      - AWS_DEFAULT_REGION=us-east-2
      - AWS_ENDPOINT_URL=http://localstack:4566
    networks:
      - form-net
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1G

  api2:
    build:
      context: .
      dockerfile: ./cmd/api/Dockerfile
    container_name: form-to-1milion-api2
    depends_on:
      - pg
    ports:
      - "8081"
    environment:
      - DB_HOST=pg
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=form_to_1milion_db
      - DB_SSLMODE=disable
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/form-to-1milion-queue
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-2
      - AWS_DEFAULT_REGION=us-east-2
      - AWS_ENDPOINT_URL=http://localstack:4566
    networks:
      - form-net
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1G

  consumer:
    build:
      context: .
      dockerfile: ./cmd/worker/Dockerfile
    container_name: form-to-1milion-consumer
    depends_on:
      - pg
    environment:
      - DB_HOST=pg
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=form_to_1milion_db
      - DB_SSLMODE=disable
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/form-to-1milion-queue
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-2
      - AWS_DEFAULT_REGION=us-east-2
      - AWS_ENDPOINT_URL=http://localstack:4566
    networks:
      - form-net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 512M

#  rabbitmq:
#    image: rabbitmq:3-management
#    container_name: form-to-1milion-rabbitmq
#    environment:
#      - RABBITMQ_DEFAULT_USER=user
#      - RABBITMQ_DEFAULT_PASS=password
